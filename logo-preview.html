<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX Logo - Final</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            gap: 50px;
            padding: 40px;
        }
        .section { text-align: center; }
        .label { font-size: 13px; color: #888; margin-top: 14px; letter-spacing: 2px; text-transform: uppercase; }
        .sublabel { font-size: 11px; color: #aaa; margin-top: 4px; }
        .row { display: flex; gap: 50px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>

    <!-- Main Logo -->
    <div class="section">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="280" height="280">
            <path d="M245,460 L130,260 C130,155 245,145 245,145 Z" fill="#000"/>
            <path d="M267,450 L267,165 C267,155 382,155 382,260 Z" fill="#000"/>
            <line x1="256" y1="145" x2="256" y2="460" stroke="#fff" stroke-width="12"/>
            <path d="M210,260 L170,260 L170,210" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M302,260 L342,260 L342,310" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="label">Final Logo</div>
    </div>

    <!-- Dark Background -->
    <div class="section">
        <div style="background:#000;padding:40px;border-radius:20px;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="220" height="220">
                <path d="M245,460 L130,260 C130,155 245,145 245,145 Z" fill="#fff"/>
                <path d="M267,450 L267,165 C267,155 382,155 382,260 Z" fill="#fff"/>
                <line x1="256" y1="145" x2="256" y2="460" stroke="#000" stroke-width="12"/>
                <path d="M210,260 L170,260 L170,210" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M302,260 L342,260 L342,310" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="label">Dark Background</div>
    </div>

    <!-- App Icons -->
    <div class="section">
        <div class="row">
            <div>
                <div style="width:140px;height:140px;background:#000;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,0.25);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="90" height="90">
                        <path d="M245,460 L130,260 C130,155 245,145 245,145 Z" fill="#fff"/>
                        <path d="M267,450 L267,165 C267,155 382,155 382,260 Z" fill="#fff"/>
                        <line x1="256" y1="145" x2="256" y2="460" stroke="#000" stroke-width="14"/>
                        <path d="M210,260 L170,260 L170,210" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M302,260 L342,260 L342,310" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="label">App Icon (140px)</div>
            </div>
            <div>
                <div style="width:72px;height:72px;background:#000;border-radius:16px;display:flex;align-items:center;justify-content:center;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="44" height="44">
                        <path d="M245,460 L140,270 C140,170 245,160 245,160 Z" fill="#fff"/>
                        <path d="M267,452 L267,180 C267,170 370,170 370,270 Z" fill="#fff"/>
                        <line x1="256" y1="160" x2="256" y2="460" stroke="#000" stroke-width="18"/>
                        <path d="M215,270 L180,270 L180,225" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M297,270 L332,270 L332,315" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="label">Small (72px)</div>
            </div>
            <div>
                <div style="width:48px;height:48px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="30" height="30">
                        <path d="M245,450 L150,280 C150,190 245,180 245,180 Z" fill="#fff"/>
                        <path d="M267,444 L267,195 C267,185 360,185 360,280 Z" fill="#fff"/>
                        <line x1="256" y1="180" x2="256" y2="450" stroke="#000" stroke-width="22"/>
                    </svg>
                </div>
                <div class="label">Tiny (48px)</div>
            </div>
        </div>
    </div>

    <!-- Website Header Preview -->
    <div class="section">
        <div style="background:#000;padding:30px 60px;border-radius:12px;display:flex;align-items:center;gap:20px;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="50" height="50">
                <path d="M245,460 L130,260 C130,155 245,145 245,145 Z" fill="#fff"/>
                <path d="M267,450 L267,165 C267,155 382,155 382,260 Z" fill="#fff"/>
                <line x1="256" y1="145" x2="256" y2="460" stroke="#000" stroke-width="14"/>
                <path d="M210,260 L170,260 L170,210" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M302,260 L342,260 L342,310" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div style="color:#fff;font-size:36px;font-weight:800;letter-spacing:6px;">MX</div>
        </div>
        <div class="label">Website Header Preview</div>
    </div>

</body>
</html>

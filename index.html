<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        .logo-text {
            font-size: 72px;
            font-weight: 800;
            color: #000000;
            letter-spacing: 16px;
            margin-bottom: 40px;
            user-select: none;
        }

        .download-btn {
            display: inline-block;
            padding: 16px 56px;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 3px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #222222;
            transform: scale(1.03);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .footer {
            background: #000000;
            color: #ffffff;
            text-align: center;
            padding: 14px 20px;
            font-size: 12px;
            letter-spacing: 0.5px;
            line-height: 1.5;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="logo-text">MX</div>
            <a href="https://github.com/mrsky01001/MX/releases/latest/download/app-debug.apk" class="download-btn">DOWNLOAD APK</a>
        </div>
    </div>
    <div class="footer">
        Android only &bull; MX sends fake GPS location on WhatsApp instead of your real location
    </div>
</body>
</html>

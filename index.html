<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            text-align: center;
        }

        .logo {
            font-size: 72px;
            font-weight: 800;
            color: #000000;
            letter-spacing: 12px;
            margin-bottom: 40px;
            user-select: none;
        }

        .download-btn {
            display: inline-block;
            padding: 16px 48px;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #333333;
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">MX</div>
        <a href="#" class="download-btn">DOWNLOAD APK</a>
    </div>
</body>
</html>
